                            sel.addRange(anchorCaretRange);
                        }
                    }
                    statusTip.innerText = "已进入局部文字框选模式：拖动鼠标选中目标词语或段落";
                    return;
                }

                isTextSelecting = false;
                isDraggingBox = false;
                hasCommittedDragStart = false;
                initX = element.offsetLeft;
                initY = element.offsetTop;

                guideCandidates = Array.from(document.querySelectorAll('.native-text-box, .stamp-box'))
                    .filter(el => el !== element)
                    .map(el => ({
                        x: el.offsetLeft,
                        y: el.offsetTop,
                        w: el.offsetWidth,
                        h: el.offsetHeight,
                        cx: el.offsetLeft + el.offsetWidth / 2,
                        cy: el.offsetTop + el.offsetHeight / 2
                    }));
            });

            const onWindowMouseMove = (e) => {
                if (!isPointerDown) return;

                if (isTextSelecting) {
                    const focusRange = getCaretRangeFromClientPoint(e.clientX, e.clientY, element);
                    if (anchorCaretRange && focusRange) {
                        const sel = window.getSelection();
                        if (sel) {
                            try {
                                const mergedRange = document.createRange();
                                const cmp = anchorCaretRange.compareBoundaryPoints(Range.START_TO_START, focusRange);
                                if (cmp <= 0) {
                                    mergedRange.setStart(anchorCaretRange.startContainer, anchorCaretRange.startOffset);
                                    mergedRange.setEnd(focusRange.startContainer, focusRange.startOffset);
                                } else {
                                    mergedRange.setStart(focusRange.startContainer, focusRange.startOffset);
                                    mergedRange.setEnd(anchorCaretRange.startContainer, anchorCaretRange.startOffset);
                                }
                                sel.removeAllRanges();
                                sel.addRange(mergedRange);
                                if (!mergedRange.collapsed) {
                                    savedRangeInBox = { box: element, range: mergedRange.cloneRange() };
                                }
                            } catch (err) {}
                        }
                    }
                    return;
                }

                const deltaX = (e.clientX - dragStartMouseX) / viewZoom;
                const deltaY = (e.clientY - dragStartMouseY) / viewZoom;

                if (!isDraggingBox && Math.hypot(deltaX, deltaY) < 2) return;

                if (!isDraggingBox) {
                    isDraggingBox = true;
                    element.classList.add('dragging');
                    const cLayer = getContentLayer(element);
                    if (cLayer) cLayer.style.backgroundColor = 'transparent';
                    const sel = window.getSelection();
                    if (sel && sel.removeAllRanges) sel.removeAllRanges();
                }

                if (!hasCommittedDragStart) {
                    hasCommittedDragStart = true;
                    saveStateToUndoStack();
                    if (element.classList.contains('native-text-box') && currentData && !currentData.erasedOnCanvas) {
                        eraseOriginalPositionCompletely(currentData);
                        currentData.erasedOnCanvas = true;
                        element.classList.add('is-editing');
                        applyInnerColorToBox(element, currentData);
                    }
                }

                const targetX = initX + deltaX;
                const targetY = initY + deltaY;
                const currentW = element.offsetWidth;
                const currentH = element.offsetHeight;
                const currentCenterX = targetX + currentW / 2;
                const currentCenterY = targetY + currentH / 2;

                const TOLERANCE = 3;
                let matchedV = false;
                let matchedH = false;

                for (let i = 0; i < guideCandidates.length; i++) {
                    const cand = guideCandidates[i];
                    if (!matchedV && (
                        Math.abs(targetX - cand.x) <= TOLERANCE ||
                        Math.abs((targetX + currentW) - (cand.x + cand.w)) <= TOLERANCE ||
                        Math.abs(currentCenterX - cand.cx) <= TOLERANCE
                    )) {
                        let guideX = cand.x;
                        if (Math.abs((targetX + currentW) - (cand.x + cand.w)) <= TOLERANCE) guideX = cand.x + cand.w;
                        else if (Math.abs(currentCenterX - cand.cx) <= TOLERANCE) guideX = cand.cx;
                        guideV.style.left = `${guideX}px`;
                        guideV.style.display = 'block';
                        matchedV = true;
                    }

                    if (!matchedH && (
                        Math.abs(targetY - cand.y) <= TOLERANCE ||
                        Math.abs((targetY + currentH) - (cand.y + cand.h)) <= TOLERANCE ||
                        Math.abs(currentCenterY - cand.cy) <= TOLERANCE
                    )) {
                        let guideY = cand.y;
                        if (Math.abs((targetY + currentH) - (cand.y + cand.h)) <= TOLERANCE) guideY = cand.y + cand.h;
                        else if (Math.abs(currentCenterY - cand.cy) <= TOLERANCE) guideY = cand.cy;
                        guideH.style.top = `${guideY}px`;
                        guideH.style.display = 'block';
                        matchedH = true;
                    }

                    if (matchedV && matchedH) break;
                }

                if (!matchedV) guideV.style.display = 'none';
                if (!matchedH) guideH.style.display = 'none';

                element.style.left = `${targetX}px`;
                element.style.top = `${targetY}px`;

                if (currentData) {
                    currentData.x = targetX;
                    currentData.y = targetY;
                    if (element.classList.contains('native-text-box')) {
                        textBlocksMap.set(currentData.id, currentData);
                    }
                }
            };

            const onWindowMouseUp = () => {
                if (!isPointerDown) return;
                isPointerDown = false;

                if (isTextSelecting) {
                    isTextSelecting = false;
                    element.classList.remove('text-selecting-mode');
                    const cLayer = getContentLayer(element);
                    if (cLayer) cLayer.style.backgroundColor = 'transparent';
                    const sel = window.getSelection();
                    if (sel && sel.rangeCount > 0 && !sel.isCollapsed) {
                        savedRangeInBox = { box: element, range: sel.getRangeAt(0).cloneRange() };
                        statusTip.innerText = "已选中局部文字 · 可直接修改颜色/字体/字号或用格式刷";
                    }
                }

                if (isDraggingBox) {
                    isDraggingBox = false;
                    element.classList.remove('dragging');
                    const cLayer = getContentLayer(element);
                    if (cLayer) cLayer.style.backgroundColor = 'transparent';
                    guideV.style.display = 'none';
                    guideH.style.display = 'none';
                }
            };

            window.addEventListener('mousemove', onWindowMouseMove);
            window.addEventListener('mouseup', onWindowMouseUp);
        }

        function hexToPdfRgb(hexStr, rgbFn) {
            const hex = (hexStr || '#000000').replace('#', '');
            const r = parseInt(hex.substring(0, 2), 16) / 255;
            const g = parseInt(hex.substring(2, 4), 16) / 255;
            const b = parseInt(hex.substring(4, 6), 16) / 255;
            return rgbFn(r, g, b);
        }

        // 解析含局部样式 span 的行片段
        function extractStyledRunsFromDom(boxEl, defaultFont, defaultSize, defaultColor) {
            const contentLayer = getContentLayer(boxEl) || boxEl;
            if (!contentLayer) return null;
            const hasPartial = contentLayer.querySelector('[data-partial-style="true"]');
            if (!hasPartial) return null;

            const runs = [];
            function walk(node, inherited) {
                if (node.nodeType === 3) {
                    const txt = node.nodeValue.replace(/\r/g, '');
                    if (txt.length > 0) {
                        runs.push({ text: txt, ...inherited });
                    }
                } else if (node.nodeType === 1) {
                    if (node.classList && node.classList.contains('resize-dot')) return;
                    const nextStyle = { ...inherited };
                    if (node.dataset && node.dataset.partialStyle === 'true') {
                        if (node.dataset.fontFamily) nextStyle.fontFamily = node.dataset.fontFamily;
                        if (node.dataset.fontSize) nextStyle.fontSize = parseFloat(node.dataset.fontSize);
                        if (node.dataset.color) nextStyle.color = node.dataset.color;
                    }
                    const isBlockBreak = (node.tagName === 'DIV' || node.tagName === 'P') && runs.length > 0;
                    if (isBlockBreak) {
                        runs.push({ text: '\n', ...nextStyle });
                    }
                    if (node.tagName === 'BR') {
                        runs.push({ text: '\n', ...nextStyle });
                        return;
                    }
                    node.childNodes.forEach(ch => walk(ch, nextStyle));
                }
            }

            walk(contentLayer, {
                fontFamily: defaultFont,
                fontSize: defaultSize,
                color: defaultColor
            });
            return runs;
        }

        downloadBtn.addEventListener('click', async () => {
            if (!rawPdfBytes) return;

            statusTip.innerText = "正在导出...";
            downloadBtn.disabled = true;

            try {
                const { PDFDocument, rgb, StandardFonts } = PDFLib;
                const pdfDocToEdit = await PDFDocument.load(rawPdfBytes);
                
                const fontMap = {
                    'Helvetica': await pdfDocToEdit.embedFont(StandardFonts.Helvetica),
                    'TimesRoman': await pdfDocToEdit.embedFont(StandardFonts.TimesRoman),
                    'Courier': await pdfDocToEdit.embedFont(StandardFonts.Courier)
                };

                const pages = pdfDocToEdit.getPages();
                const firstPage = pages[0];

                let modifiedCount = 0;

                textBlocksMap.forEach((item, idxKey) => {
                    const domBox = textLayerDiv.querySelector(`.native-text-box[data-id="${idxKey}"]`);
                    const contentLayer = getContentLayer(domBox);
                    const hasPartialDom = !!(contentLayer && contentLayer.querySelector('[data-partial-style="true"]'));

                    const isMoved = item.x !== item.origX || item.y !== item.origY;
                    const isTextChanged = item.originalText !== item.currentText;
                    const isStyleChanged = item.currentFontSize !== item.originalFontSize ||
                                           item.currentColor !== item.originalColor ||
                                           item.currentFontFamily !== item.originalFontFamily ||
                                           hasPartialDom;

                    if (!isTextChanged && !isMoved && !isStyleChanged) return;
                    modifiedCount++;

                    const subItems = (item.items && item.items.length > 0) ? item.items : [item];
                    const pdfPad = 1.5 / scale;

                    // 第一层：先在文本对应区域绘制纯色底色矩形填充到底面（微扩覆盖完整笔画边缘）
                    subItems.forEach(sub => {
                        const origPdfX = sub.origX / scale;
                        const origPdfY = pdfPageHeight - (sub.origY / scale) - (sub.origH / scale);
                        const origBg = sub.origBgColor || item.origBgColor || { r: 255, g: 255, b: 255 };

                        firstPage.drawRectangle({
                            x: origPdfX - pdfPad,
                            y: origPdfY - pdfPad,
                            width: (sub.origW / scale) + pdfPad * 2,
                            height: (sub.origH / scale) + pdfPad * 2,
                            color: rgb(origBg.r / 255, origBg.g / 255, origBg.b / 255),
                        });
                    });

                    // 第二层：在第一层纯色底色上方绘制无底色文本
                    const finalFontSize = item.currentFontSize || item.originalFontSize;
                    const baseFontName = fontMap[item.currentFontFamily] ? item.currentFontFamily : 'Helvetica';
                    const baseColorHex = item.currentColor || item.originalColor;

                    const styledRuns = extractStyledRunsFromDom(domBox, baseFontName, finalFontSize, baseColorHex);

                    if (styledRuns) {
                        const linesRuns = [[]];
                        styledRuns.forEach(r => {
                            const parts = r.text.split('\n');
                            parts.forEach((p, pIdx) => {
                                if (pIdx > 0) linesRuns.push([]);
                                const clean = p.replace(/[^\x00-\x7F]/g, '');
                                if (clean.length > 0) {
                                    linesRuns[linesRuns.length - 1].push({
                                        text: clean,
                                        fontFamily: r.fontFamily,
                                        fontSize: r.fontSize,
                                        color: r.color
                                    });
                                }
                            });
                        });

                        const firstSubH = subItems[0] ? (subItems[0].origH / scale) : (finalFontSize * 1.1);
                        const lineStep = Math.max(finalFontSize * 1.25, firstSubH);

                        linesRuns.forEach((lineArr, lIdx) => {
                            if (lineArr.length === 0) return;
                            const useOrigLinePos = !isMoved && linesRuns.length === subItems.length;
                            let cursorX = useOrigLinePos ? (subItems[lIdx].origX / scale) : (item.x / scale);
                            const linePdfY = useOrigLinePos
                                ? (pdfPageHeight - (subItems[lIdx].origY / scale) - (subItems[lIdx].origH / scale))
                                : (pdfPageHeight - ((item.y + lIdx * lineStep * scale) / scale) - firstSubH);

                            lineArr.forEach(run => {
                                const fKey = fontMap[run.fontFamily] ? run.fontFamily : baseFontName;
                                const fObj = fontMap[fKey];
                                const fSize = run.fontSize || finalFontSize;
                                const cObj = hexToPdfRgb(run.color || baseColorHex, rgb);
                                firstPage.drawText(run.text, {
                                    x: cursorX,
                                    y: linePdfY + (fSize * 0.08),
                                    size: fSize,
                                    font: fObj,
                                    color: cObj,
                                });
                                cursorX += fObj.widthOfTextAtSize(run.text, fSize);
                            });
                        });
                    } else {
                        const cleanedLines = item.currentText
                            .replace(/\r/g, '')
                            .split('\n')
                            .map(line => line.replace(/[^\x00-\x7F]/g, '').trim())
                            .filter(line => line.length > 0);

                        if (cleanedLines.length === 0) return;

                        const activeFont = fontMap[baseFontName];
                        const textColor = hexToPdfRgb(baseColorHex, rgb);

                        if (!isMoved && cleanedLines.length === subItems.length) {
                            cleanedLines.forEach((lineText, idx) => {
                                const sub = subItems[idx];
                                const linePdfX = sub.origX / scale;
                                const linePdfY = pdfPageHeight - (sub.origY / scale) - (sub.origH / scale);
                                firstPage.drawText(lineText, {
                                    x: linePdfX,
                                    y: linePdfY + (finalFontSize * 0.08),
                                    size: finalFontSize,
                                    font: activeFont,
                                    color: textColor,
                                });
                            });
                        } else {
                            const basePdfX = item.x / scale;
                            const firstSubH = subItems[0] ? (subItems[0].origH / scale) : (finalFontSize * 1.1);
                            const lineStep = Math.max(finalFontSize * 1.25, firstSubH);

                            cleanedLines.forEach((lineText, idx) => {
                                const lineTopPx = item.y + idx * lineStep * scale;
                                const linePdfY = pdfPageHeight - (lineTopPx / scale) - firstSubH;
                                firstPage.drawText(lineText, {
                                    x: basePdfX,
                                    y: linePdfY + (finalFontSize * 0.08),
                                    size: finalFontSize,
                                    font: activeFont,
                                    color: textColor,
                                });
                            });
                        }
                    }
                });

                for (let stamp of stampsList) {
                    const imgBytes = await fetch(stamp.dataUrl).then(res => res.arrayBuffer());
                    let embeddedImage;
                    if (stamp.mimeType.includes('png') || stamp.dataUrl.includes('image/png')) {
                        embeddedImage = await pdfDocToEdit.embedPng(imgBytes);
                    } else {
                        embeddedImage = await pdfDocToEdit.embedJpg(imgBytes);
                    }

                    const pdfStampX = stamp.x / scale;
                    const pdfStampW = stamp.width / scale;
                    const pdfStampH = stamp.height / scale;
                    const pdfStampY = pdfPageHeight - (stamp.y / scale) - pdfStampH;

                    firstPage.drawImage(embeddedImage, {
                        x: pdfStampX,
                        y: pdfStampY,
                        width: pdfStampW,
                        height: pdfStampH,
                    });
                    modifiedCount++;
                }

                const modifiedPdfBytes = await pdfDocToEdit.save();
                const blob = new Blob([modifiedPdfBytes], { type: 'application/pdf' });
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = 'modified_and_stamped.pdf';
                link.click();

                statusTip.innerText = `导出成功！应用了 ${modifiedCount} 处修改。`;
            } catch (err) {
                statusTip.innerText = `导出失败: ${err.message || '请查看控制台'}`;
                console.error("PDF Export Error:", err);
            } finally {
                downloadBtn.disabled = false;
            }
        });
    </script>
</body>
